p-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go back" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex items-center gap-space-xs"><div class="w-6 h-6 rounded-lg bg-primary-container flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[14px]">bolt</span></div><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Add Address</h1></div></div><div class="flex items-center gap-space-xs shrink-0"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full pb-safe">
<div class="px-margin-mobile pt-space-md flex flex-col gap-space-md">
<div class="relative w-full rounded-xl overflow-hidden shadow-sm bg-surface-container">
<div class="w-full h-44 bg-cover bg-center relative flex items-center justify-center" data-location="1042 Birch Lane, Springfield" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuARn-L1B0RRFw75vMrcplxqSa9wLQ8s_hJeCEHV5QMmFw1ltUIm0e91zlLPZmQGexXOdM9QVBusXkrQEn3q5_zHdVO9pI70HKp_G6lfPE4TybUWj9pPrq3_ETIkUszCoH8MknLgaAImVbmaEnqL-ywvSX5PpzRl8QqQiJC3FrnG1qSBUXFTH_9uaX14gw7dTl_5p7RtM8wYH4vWxWnU-Jv4SX7hj7zZsmR7sVFWWRoATWaTNTOngNV8')">
<div class="absolute inset-0 bg-on-surface/10 backdrop-blur-[1px]"></div>
<div class="relative flex flex-col items-center z-10 -translate-y-2 animate-bounce">
<div class="bg-surface-container-lowest text-on-surface px-space-sm py-1 rounded-full shadow-md flex items-center gap-1 mb-1">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-label-sm text-label-sm">Pin: 1042 Birch Lane</span>
</div>
<div class="w-9 h-9 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-lg shadow-primary-container/30">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="w-2 h-1 bg-on-surface/30 rounded-full blur-[1px] mt-0.5"></div>
</div>
<button class="absolute top-2.5 right-2.5 z-10 bg-surface-container-lowest/95 text-on-surface hover:text-primary active:scale-95 transition-all px-space-sm py-1.5 rounded-lg shadow-sm flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px] text-primary-container">tune</span>
<span class="font-label-sm text-label-sm">Adjust Pin</span>
</button>
<div class="absolute bottom-2.5 left-2.5 right-2.5 z-10">
<div class="bg-surface-container-lowest/95 backdrop-blur-md px-space-sm py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[16px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-label-sm text-on-surface truncate">Verified in Springfield Delivery Zone</span>
</div>
</div>
</div>
</div>
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary">bookmark</span>
          Address Label
        </label>
<div class="flex items-center gap-space-xs overflow-x-auto py-0.5">
<button class="label-pill px-space-md py-2 rounded-full font-label-md text-label-md bg-primary-container text-on-primary shadow-sm flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">home</span>
            Home
          </button>
<button class="label-pill px-space-md py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">work</span>
            Work
          </button>
<button class="label-pill px-space-md py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">favorite</span>
            Partner
          </button>
<button class="label-pill px-space-md py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">more_horiz</span>
            Other
          </button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="street-input">Street Address</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-on-surface-variant text-[20px]">pin_drop</span>
<input class="w-full h-[52px] pl-11 pr-11 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="street-input" placeholder="Search address or landmark" type="text" value="1042 Birch Lane"/>
<button class="absolute right-3 w-7 h-7 rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-variant flex items-center justify-center transition-colors" onclick="document.getElementById('street-input').value = '';" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
<div class="grid grid-cols-2 gap-space-sm">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="apt-input">Apt / Suite / Floor</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-on-surface-variant text-[18px]">apartment</span>
<input class="w-full h-[52px] pl-10 pr-3 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:shadow-md transition-all" id="apt-input" placeholder="Apt 4B (Opt)" type="text" value="Apt 2B"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="gate-input">Access / Gate Code</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-on-surface-variant text-[18px]">key</span>
<input class="w-full h-[52px] pl-10 pr-3 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:shadow-md transition-all" id="gate-input" placeholder="e.g. #1234" type="text"/>
</div>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary">front_hand</span>
          Drop-off Preference
        </label>
<div class="grid grid-cols-3 gap-space-xs p-1 rounded-xl bg-surface-container shadow-inner">
<button class="dropoff-option flex flex-col items-center justify-center py-2.5 px-1 rounded-lg bg-surface-container-lowest text-primary-container shadow-sm transition-all text-center" type="button">
<span class="material-symbols-outlined text-[20px] mb-0.5">door_front</span>
<span class="font-label-sm text-label-sm leading-tight">Leave at Door</span>
</button>
<button class="dropoff-option flex flex-col items-center justify-center py-2.5 px-1 rounded-lg text-on-surface-variant hover:text-on-surface transition-all text-center" type="button">
<span class="material-symbols-outlined text-[20px] mb-0.5">front_hand</span>
<span class="font-label-sm text-label-sm leading-tight">Hand to Me</span>
</button>
<button class="dropoff-option flex flex-col items-center justify-center py-2.5 px-1 rounded-lg text-on-surface-variant hover:text-on-surface transition-all text-center" type="button">
<span class="material-symbols-outlined text-[20px] mb-0.5">domain</span>
<span class="font-label-sm text-label-sm leading-tight">Lobby / Out</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="instructions-input">Delivery Instructions</label>
<span class="font-body-sm text-body-sm text-on-surface-variant" id="char-counter">68/150</span>
</div>
<div class="relative">
<textarea class="w-full p-3 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none resize-none focus:shadow-md transition-all" id="instructions-input" maxlength="150" placeholder="Add details (e.g. call upon arrival, gate latch tricks...)" rows="3">Leave on front porch behind the potted plant. Ring bell once.</textarea>
</div>
</div>
<label class="flex items-center gap-space-sm p-space-sm rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer select-none">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" id="default-address-toggle" type="checkbox"/>
<div class="w-6 h-6 rounded-lg bg-surface-container peer-checked:bg-primary-container transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Set as default delivery address</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Quick-select this location for future orders</span>
</div>
</label>
<div class="mt-space-sm flex flex-col gap-space-sm pb-space-lg">
<button class="w-full h-[52px] rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg shadow-md shadow-primary-container/25 flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform" type="button">
<span>Save &amp; Use This Address</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full py-2.5 text-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" onclick="history.back()" type="button">
          Cancel and return to Address Selection
        </button>
</div>
</form>
</div>
<script>
    (function() {
      const textarea = document.getElementById('instructions-input');
      const counter = document.getElementById('char-counter');
      if (textarea && counter) {
        textarea.addEventListener('input', function() {
          counter.textContent = textarea.value.length + '/150';
        });
      }

      const pillBtns = document.querySelectorAll('.label-pill');
      pillBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          pillBtns.forEach(b => {
            b.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
            b.classList.add('bg-surface-container', 'text-on-surface-variant');
          });
          btn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
          btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
        });
      });

      const dropoffOptions = document.querySelectorAll('.dropoff-option');
      dropoffOptions.forEach(opt => {
        opt.addEventListener('click', () => {
          dropoffOptions.forEach(o => {
            o.classList.remove('bg-surface-container-lowest', 'text-primary-container', 'shadow-sm');
            o.classList.add('text-on-surface-variant');
          });
          opt.classList.add('bg-surface-container-lowest', 'text-primary-container', 'shadow-sm');
          opt.classList.remove('text-on-surface-variant');
        });
      });
    })();
  </script>
</div></main></body></html>
