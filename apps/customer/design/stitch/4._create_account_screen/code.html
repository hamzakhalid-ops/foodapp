<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('togglePassword');
  const pwdInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && pwdInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Confirm password live match indicator
  const confirmPwdInput = document.getElementById('confirmPassword');
  const matchIcon = document.getElementById('matchIcon');

  function checkPasswordMatch() {
    if (!confirmPwdInput || !pwdInput || !matchIcon) return;
    const pwd = pwdInput.value;
    const confirmPwd = confirmPwdInput.value;

    if (confirmPwd.length === 0) {
      matchIcon.className = 'material-symbols-outlined text-[20px] text-outline-variant transition-colors';
      matchIcon.textContent = 'check_circle';
      return;
    }

    if (pwd === confirmPwd && pwd.length >= 8) {
      matchIcon.className = 'material-symbols-outlined text-[20px] text-primary-container transition-colors';
      matchIcon.textContent = 'check_circle';
      matchIcon.style.fontVariationSettings = "'FILL' 1";
    } else {
      matchIcon.className = 'material-symbols-outlined text-[20px] text-error transition-colors';
      matchIcon.textContent = 'cancel';
      matchIcon.style.fontVariationSettings = "'FILL' 0";
    }
  }

  if (confirmPwdInput && pwdInput) {
    confirmPwdInput.addEventListener('input', checkPasswordMatch);
    pwdInput.addEventListener('input', checkPasswordMatch);
  }
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe pointer-events-none flex justify-center items-end"><div class="w-32 h-1 mb-2 bg-on-surface/20 rounded-full"></div></footer></body></html>
