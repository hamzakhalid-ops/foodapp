<script>
  (function() {
    const labels = document.querySelectorAll('.sort-option');
    const applyBtn = document.getElementById('applySortBtn');

    labels.forEach(label => {
      label.addEventListener('click', () => {
        labels.forEach(l => {
          l.classList.remove('bg-primary-fixed/30');
          l.classList.add('bg-surface-container-low');
          const radioDot = l.querySelector('.radio-circle');
          if (radioDot) {
            radioDot.classList.remove('bg-primary-container');
            radioDot.classList.add('bg-surface-container-high');
            const innerDot = radioDot.querySelector('.dot');
            if (innerDot) innerDot.classList.add('hidden');
          }
          const iconContainer = l.querySelector('.shrink-0.self-center');
          if (iconContainer) {
            iconContainer.classList.remove('text-primary');
            iconContainer.classList.add('text-on-surface-variant');
          }
        });

        label.classList.remove('bg-surface-container-low');
        label.classList.add('bg-primary-fixed/30');

        const activeRadio = label.querySelector('.radio-circle');
        if (activeRadio) {
          activeRadio.classList.remove('bg-surface-container-high');
          activeRadio.classList.add('bg-primary-container');
          const innerDot = activeRadio.querySelector('.dot');
          if (innerDot) innerDot.classList.remove('hidden');
        }

        const activeIcon = label.querySelector('.shrink-0.self-center');
        if (activeIcon) {
          activeIcon.classList.remove('text-on-surface-variant');
          activeIcon.classList.add('text-primary');
        }
      });
    });

    if (applyBtn) {
      applyBtn.addEventListener('click', () => {
        const checked = document.querySelector('input[name="sort_method"]:checked');
        const value = checked ? checked.value : 'recommended';
        applyBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Applying...</span>';
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          }
        }, 320);
      });
    }
  })();
